id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.3.1/prelora-desktop-v0.3.1-x86_64.tar.gz
        sha256: "653e4594ca520e03f3893be2e9ef0d60a921819f6a52bced88a96305ce0232ff"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.3.1/prelora-desktop-v0.3.1-aarch64.tar.gz
        sha256: "2dbd3d9c9fd7da31330d97962bd17bbfc919295466f2b2776e5ff9630a8a640a"
        strip-components: 0
