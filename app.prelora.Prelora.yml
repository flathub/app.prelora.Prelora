id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.3.5/prelora-desktop-v0.3.5-x86_64.tar.gz
        sha256: "1f8d86fa03c8b3ae1a809e6a8fe5a1acdd1cac038a186d184a9fbb008831c022"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.3.5/prelora-desktop-v0.3.5-aarch64.tar.gz
        sha256: "a81cd59adc1d88dabc20c34494903c486d8068957681dfd9ca6cb8c29d860776"
        strip-components: 0
