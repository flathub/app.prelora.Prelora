id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.5.0/prelora-desktop-v0.5.0-x86_64.tar.gz
        sha256: "5f2671ebfa93a5afe2f1e7eab4fd912dad8dc5c7a5f2aa6acdb677541a3a10e0"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.5.0/prelora-desktop-v0.5.0-aarch64.tar.gz
        sha256: "e6f31b70d37431f8a9b3711cc8ed980fa74ed85b83786111f37d0017eb235fb3"
        strip-components: 0
