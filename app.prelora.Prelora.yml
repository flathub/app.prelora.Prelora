id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.3.8/prelora-desktop-v0.3.8-x86_64.tar.gz
        sha256: "762e6e10d3652672843a9102be6daa02cf3bd7c91407c07ca7e7525aa9f55236"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.3.8/prelora-desktop-v0.3.8-aarch64.tar.gz
        sha256: "9d59d19df26b52f876d068ac48254b0e1c3ace3fe06f32369e336fa5c4e0ece9"
        strip-components: 0
