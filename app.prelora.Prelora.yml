id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.3.2/prelora-desktop-v0.3.2-x86_64.tar.gz
        sha256: "6ad54c56069b03a9bc2ebb1c6ade8f00efc1900cee10321981c9c6f6f9e52ced"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.3.2/prelora-desktop-v0.3.2-aarch64.tar.gz
        sha256: "2c5d66341bf51072af809856d855b0d627dc41e17c0a1fee7bb5da27f7f10b83"
        strip-components: 0