id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.2.0/prelora-desktop-v0.2.0-x86_64.tar.gz
        sha256: "e2fad09b8e3f923ecd8803b62be05ee5ae1ad6ffefb5f26965dae7af809dc27d"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.2.0/prelora-desktop-v0.2.0-aarch64.tar.gz
        sha256: "05de5b05d8ad23fcb61babd12a0dcfa8439e71c15bcf4f4643ea45d8fb8456d0"
        strip-components: 0
