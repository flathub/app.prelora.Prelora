id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.3.0/prelora-desktop-v0.3.0-x86_64.tar.gz
        sha256: "8161526c54e369620b4ea90060807022669c25e625757ac2de8b6b1f830a9ec7"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.3.0/prelora-desktop-v0.3.0-aarch64.tar.gz
        sha256: "bc649e4e72ea7a85bd772c1b84c1857d940d5c5583b6c1a65db501ed999b7408"
        strip-components: 0
