id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.4.3/prelora-desktop-v0.4.3-x86_64.tar.gz
        sha256: "5dfa9871526a43a3a448630aae186e996e9300b3a5ca9b0749234f21ee17f6fa"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.4.3/prelora-desktop-v0.4.3-aarch64.tar.gz
        sha256: "b7c3334cf42239fb4fce7c94634e693cbae7377d00b82082bfa2e467cf7316d4"
        strip-components: 0
