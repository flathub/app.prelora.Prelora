id: app.prelora.Prelora
runtime: org.gnome.Platform
runtime-version: "51"
sdk: org.gnome.Sdk
command: prelora-desktop

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network
  - --talk-name=org.kde.StatusNotifierWatcher

modules:
  - name: prelora-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 usr/bin/prelora-desktop /app/bin/prelora-desktop
      - cp -a usr/share /app/
    sources:
      - type: archive
        only-arches:
          - x86_64
        url: https://prelora.app/downloads/v0.4.1/prelora-desktop-v0.4.1-x86_64.tar.gz
        sha256: "88510bbf5f1fc1f4f4b1c2f02411d47c10b2a4a8def53ac7e270d4d393265647"
        strip-components: 0
      - type: archive
        only-arches:
          - aarch64
        url: https://prelora.app/downloads/v0.4.1/prelora-desktop-v0.4.1-aarch64.tar.gz
        sha256: "bb6f86d84658fdd4508603e457d91af3cabfe065c5e37b4589ac50fdbc85e424"
        strip-components: 0
